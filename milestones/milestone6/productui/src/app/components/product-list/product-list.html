<h2 class="mb-3">Products</h2>

@if (products.length > 0) {
  <table class="table table-striped table-bordered">
    <thead>
      <tr>
        <th>ID</th>
        <th>Name</th>
        <th>Description</th>
        <th>Price</th>
        <th>Quantity</th>
        <th style="width: 250px;">Actions</th>
      </tr>
    </thead>
    <tbody>
      @for (p of products; track p.id) {
        <tr>
          <td>{{ p.id }}</td>
          <td>{{ p.name }}</td>
          <td>{{ p.description }}</td>
          <td>{{ p.price | currency }}</td>
          <td>{{ p.quantity }}</td>
          <td>
            <button class="btn btn-sm btn-secondary me-2" (click)="goToView(p.id)">View</button>
            <button class="btn btn-sm btn-warning me-2" (click)="goToEdit(p.id)">Edit</button>
            <button class="btn btn-sm btn-danger" (click)="deleteProduct(p.id)">Delete</button>
          </td>
        </tr>
      }
    </tbody>
  </table>
} @else {
  <div class="alert alert-info">
    No products found.
  </div>
}
