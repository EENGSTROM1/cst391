<h2 class="mb-3">Edit Product</h2>

<form (ngSubmit)="update()" #formRef="ngForm">

  <div class="mb-3">
    <label class="form-label">Name</label>
    <input
      type="text"
      class="form-control"
      name="name"
      [(ngModel)]="product.name"
      required>
  </div>

  <div class="mb-3">
    <label class="form-label">Description</label>
    <textarea
      class="form-control"
      name="description"
      [(ngModel)]="product.description"
      rows="3"
      required>
    </textarea>
  </div>

  <div class="mb-3">
    <label class="form-label">Price</label>
    <input
      type="number"
      class="form-control"
      name="price"
      [(ngModel)]="product.price"
      step="0.01"
      required>
  </div>

  <div class="mb-3">
    <label class="form-label">Quantity</label>
    <input
      type="number"
      class="form-control"
      name="quantity"
      [(ngModel)]="product.quantity"
      required>
  </div>

  <div class="d-flex gap-2">
    <button
      type="submit"
      class="btn btn-warning"
      [disabled]="!formRef.valid">
      Update
    </button>

    <button
      type="button"
      class="btn btn-secondary"
      (click)="cancel()">
      Cancel
    </button>
  </div>

</form>
