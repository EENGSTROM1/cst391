<div class="container mt-4" *ngIf="album">

  <h2 class="mb-4">Edit Album</h2>

  <div class="mb-3">
    <label class="form-label">Artist</label>
    <input type="text" class="form-control" [(ngModel)]="album.artist">
  </div>

  <div class="mb-3">
    <label class="form-label">Title</label>
    <input type="text" class="form-control" [(ngModel)]="album.title">
  </div>

  <div class="mb-3">
    <label class="form-label">Year</label>
    <input type="number" class="form-control" [(ngModel)]="album.year">
  </div>

  <div class="mb-3">
    <label class="form-label">Image URL</label>
    <input type="text" class="form-control" [(ngModel)]="album.image">
  </div>

  <div class="mb-3">
    <label class="form-label">Description</label>
    <textarea class="form-control" rows="3" [(ngModel)]="album.description"></textarea>
  </div>

  <button class="btn btn-primary me-2" (click)="save()">Save Changes</button>
  <button class="btn btn-secondary" routerLink="/list-artists">Cancel</button>

</div>

<div *ngIf="!album" class="container mt-4">
  <p>Loading album...</p>
</div>
