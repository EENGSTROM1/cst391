<div class="container mt-4" *ngIf="album">

  <h2 class="text-danger">Delete Album</h2>

  <p>Are you sure you want to delete this album?</p>

  <div class="card p-3 mb-3">
    <h4>{{ album.title }}</h4>
    <p><strong>Artist:</strong> {{ album.artist }}</p>
    <p><strong>Year:</strong> {{ album.year }}</p>
  </div>

  <button
    class="btn btn-danger me-2"
    (click)="confirmDelete()">
    Confirm Delete
  </button>

  <button
    class="btn btn-secondary"
    (click)="cancel()">
    Cancel
  </button>

</div>

<div *ngIf="!album" class="container mt-4">
  <p>Loading album...</p>
</div>
